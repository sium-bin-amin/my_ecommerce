{% extends 'shop/base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 50px auto; text-align: center; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <div style="color: #d9534f; font-size: 60px; margin-bottom: 20px;">
        <i class="fas fa-times-circle"></i>
    </div>
    <h2 style="color: #333;">Payment Failed!</h2>
    <p style="color: #777; font-size: 18px; margin-bottom: 30px;">
        দুঃখিত, আপনার পেমেন্টটি সম্পন্ন করা সম্ভব হয়নি। <br>
        <strong>Error Details:</strong> {{ error }}
    </p>
    
    <div style="display: flex; gap: 15px; justify-content: center;">
        <a href="{% url 'cart' %}" class="btn" style="background: #f0c14b; color: #111; padding: 10px 25px;">Back to Cart</a>
        <a href="{% url 'home' %}" class="btn" style="background: #232f3e; color: white; padding: 10px 25px;">Go Home</a>
    </div>
</div>
{% endblock %}
