<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProShop | Ecommerce</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        header { background: #232f3e; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #febd69; text-decoration: none; }
        nav { display: flex; align-items: center; }
        nav a { color: white; margin-left: 20px; text-decoration: none; font-size: 14px; }
        .search-bar { flex-grow: 0.5; display: flex; margin: 0 20px; }
        .search-bar input { width: 100%; padding: 8px; border-radius: 4px 0 0 4px; border: none; outline: none; }
        .search-bar button { padding: 8px 15px; border: none; background: #febd69; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: bold; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; min-height: 80vh; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 5px; text-decoration: none; text-align: center; font-size: 14px; font-weight: bold; transition: 0.3s; cursor: pointer; border: none; }
        footer { background: #232f3e; color: white; text-align: center; padding: 40px 20px; margin-top: 50px; }
        footer a { color: #febd69; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">ProShop</a>
        
        <form class="search-bar" action="{% url 'search' %}" method="GET">
            <input type="text" name="q" placeholder="Search products..." value="{{ query|default:'' }}">
            <button type="submit">Search</button>
        </form>

        <nav>
            <a href="/">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">My Orders</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
            <a href="{% url 'cart' %}" style="color: #febd69; font-weight: bold;">Cart ({{ cart_count }})</a>
        </nav>
    </header>

    <div class="container">
        {% block content %} {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 ProShop | All Rights Reserved</p>
        <p>
            <a href="{% url 'terms_conditions' %}" target="_blank" rel="noopener noreferrer">Terms & Conditions</a> | 
            <a href="#">Delivery Policy</a>
        </p>
    </footer>
</body>
</html>
